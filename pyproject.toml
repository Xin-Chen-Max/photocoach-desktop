[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photocoach"
version = "0.12.1"
description = "PhotoCoach: single-photo RAW editor with optional manual AI coaching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "rawpy>=0.25,<0.28",
  "PySide6>=6.8,<7",
  "Pillow>=11,<13",
  "tifffile>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
agent = ["mcp>=1.0", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
photocoach = "photocoach.app:main"
photocoach-verify = "photocoach.cli:main"
photocoach-mcp = "photocoach.mcp_server:main"
photocoach-eval = "photocoach.agent_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photocoach = ["assets/PhotoCoach.ico", "assets/PhotoCoach.png", "assets/chevron-down.svg", "assets/chevron-up.svg", "assets/check.svg"]

[tool.setuptools.exclude-package-data]
photocoach = ["assets/PhotoCoach-source.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_raw: requires a user-provided Sony A7C II ARW sample"]
