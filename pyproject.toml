[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photocoach"
version = "0.10.2"
description = "PhotoCoach: single-photo RAW editor with optional manual AI coaching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Xin Chen"}]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "rawpy>=0.25,<0.28",
  "PySide6>=6.8,<7",
  "Pillow>=11,<13",
  "tifffile>=2025.1",
]

[project.urls]
Repository = "https://github.com/Xin-Chen-Max/photocoach-desktop"
Issues = "https://github.com/Xin-Chen-Max/photocoach-desktop/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
photocoach = "photocoach.app:main"
photocoach-verify = "photocoach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photocoach = ["assets/PhotoCoach.ico", "assets/PhotoCoach.png", "assets/chevron-down.svg", "assets/chevron-up.svg", "assets/check.svg"]

[tool.setuptools.exclude-package-data]
photocoach = ["assets/PhotoCoach-source.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_raw: requires a user-provided Sony A7C II ARW sample"]
